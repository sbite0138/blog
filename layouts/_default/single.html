{{ define "main" }}
<div class="single">
  <article class="post">
    <h1 class="post-title">{{ .Title }}</h1>
    {{ partial "post-meta.html" . }}
    <div class="post-body">
      {{ .Content }}
    </div>
  </article>
  <nav class="post-nav">
    {{ with .NextInSection }}<a class="prev" href="{{ .RelPermalink }}">&larr; {{ .Title }}</a>{{ end }}
    {{ with .PrevInSection }}<a class="next" href="{{ .RelPermalink }}">{{ .Title }} &rarr;</a>{{ end }}
  </nav>
</div>
{{ end }}
